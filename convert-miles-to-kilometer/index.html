<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecotrustia Solutions - Miles to Kilometers Converter</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    

    <!-- Hero Section -->
    <section class="hero">
      <div class="hero-content">
        <h1>Miles to Kilometers Converter</h1>
        <p>
          Quickly convert between miles and kilometers with our easy-to-use
          tool. Perfect for travelers, runners, and anyone needing quick
          distance conversions.
        </p>
      </div>
    </section>

    <!-- Converter Section -->
    <section class="section">
      <div class="section-title">
        <h2>Distance Converter</h2>
      </div>
      <div class="converter-container">
        <div class="converter-row">
          <div class="converter-column">
            <h3>Miles</h3>
            <div class="input-group">
              <label for="miles-input">Miles (mi)</label>
              <input
                type="number"
                id="miles-input"
                placeholder="Enter miles"
                step="0.01"
              />
            </div>
          </div>

          <div class="unit-switch">
            <button class="unit-switch-btn" id="switch-units">
              <i class="fas fa-exchange-alt"></i>
            </button>
          </div>

          <div class="converter-column">
            <h3>Kilometers</h3>
            <div class="input-group">
              <label for="km-input">Kilometers (km)</label>
              <input
                type="number"
                id="km-input"
                placeholder="Enter kilometers"
                step="0.01"
              />
            </div>
          </div>
        </div>

        <div class="conversion-info">
          <h4>Conversion Formula</h4>
          <p>
            1 mile = 1.609344 kilometers<br />
            1 kilometer = 0.621371 miles
          </p>
        </div>

        <div class="action-buttons">
          <button id="reset-btn" class="btn btn-reset">
            <i class="fas fa-redo"></i> Reset
          </button>
        </div>
      </div>
    </section>

    

    <script src="script.js" defer></script>
  </body>
</html>
